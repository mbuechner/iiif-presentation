version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: cron
      cronjob: '13 6 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      maven-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/check-container
    schedule:
      interval: cron
      cronjob: '23 6 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: '33 6 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: amazoncorretto
        versions: ['>= 26']
      # Keep Maven 3 / Java 25. The release workflow checks the tag's digest.
      - dependency-name: maven
