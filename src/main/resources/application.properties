server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=128
server.port=${IIIF_PORT:8080}
server.servlet.context-path=${IIIF_PATH_PREFIX:/}
iiif.baseurl=${IIIF_BASEURL:http://localhost:${server.port}}
iiif.max-metadata-bytes=${IIIF_MAX_METADATA_BYTES:67108864}
iiif.max-manifest-bytes=${IIIF_MAX_MANIFEST_BYTES:67108864}
