<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>Deutsche Digitale Bibliothek | IIIF Presentation API 3.0-Manifeste</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <style>
            body {
                background: #EC0A3C;
                background: linear-gradient(276.83deg, #EC0A3C, #A5003B);
                min-height: 100vh;
            }
            .form-control::placeholder {
                color: #ccc;

            }
            .image-parent {
                max-height: 80px;
            }</style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row my-5">
                <div class="col-lg-12 mx-auto text-white text-center">
                    <h1 class="display-4">IIIF Presentation API 3.0</h1>
                    <p class="lead mb-0">Mit diesem Dienst können DDB-Objekte zu IIIF Presentation API 3.0-Manifeste umgewandelt werden.</p>
                    <p class="lead mb-0"> Außerdem können die IIIF-Manifeste in den verschiedenen Viewer betrachtet werden.</p>
                    <p class="lead">Implementierung auf <a class="text-white" href="https://github.com/mbuechner/iiif" target="_blank" rel="noopener"><u>GitHub</u></a>. </p>
                </div>
            </div>
            <div class="row mb-3 col-12 col-md-9 mx-auto">
                <div class="p-1 bg-light rounded shadow-sm mb-4">
                    <div class="input-group">
                        <button aria-expanded="false" class="btn btn-light dropdown-toggle rounded-start col col-12 col-xl-3 mx-auto" data-bs-toggle="dropdown" id="displayType" type="button">IIIF Presentation API 3.0 Manifest</button>
                        <ul class="dropdown-menu dropdown-menu-start col col-12 col-xl-3 mx-auto" id="displayTypeDropdown">
                            <li>
                                <button type="button" class="dropdown-item" data-href="">IIIF Presentation API 3.0 Manifest</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://projectmirador.org/embed/?iiif-content=">Mirador 3</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://labs.deutsche-digitale-bibliothek.de/app/iiif-presentation/ddbviewer.html?manifest=">DDBviewer // Mirador 3 mit Plug-ins</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://uv-v4.netlify.app/#?manifest=">Universal Viewer 4</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://tify.rocks/?manifest=">Tify</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://samvera-labs.github.io/clover-iiif/?iiif-content=">Clover</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://ncsu-libraries.github.io/annona/tools/#/display?viewtype=iiif-rangestoryboard&amp;settings=%7B%22fullpage%22%3Atrue%7D&amp;url=">Annona</button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" data-href="https://presentation-validator.iiif.io/validate?version=3.0&amp;url=">Presentation API Validator</button>
                            </li>
                        </ul>
                        <input aria-label="URL eines DDB-Objekts" class="form-control col col-12 col-xl-8 mx-auto" id="input" placeholder="https://www.deutsche-digitale-bibliothek.de/item/CRHMM44XWLG7ZNH55BQ5GSAHTYLXJ7Z4" type="url">
                        <a class="btn bg-light rounded-end disabled col col-12 col-xl-1 mx-auto" id="los" aria-disabled="true" target="_blank" rel="noopener">Los!</a>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12 col-xxl-10 mx-auto">
                    <div class="row">
                        <!-- Linke Spalte -->
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <h5 class="text-white">DDB-Objekte</h5>
                            <div class="list-group" id="ddb-listgroup"></div>
                        </div>
                        <!-- Rechte Spalte -->
                        <div class="col-12 col-md-6">
                            <h5 class="text-white">METS/MODS-Daten</h5>
                            <div class="list-group" id="metsmods-listgroup"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <template id="example-item">
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold list-group-item-title">Titel</div>
                    <div class="row small">
                        <div class="col-12 mb-1 text-break list-group-item-link"></div>
                        <div class="col-12 text-muted list-group-item-text mb-1"></div>
                        <div class="col-12 fw-medium">Metadatenformat: <span class="list-group-item-type">?</span></div>
                    </div>
                </div>
                <img alt="" class="img-fluid image-parent list-group-item-image" loading="lazy" hidden>
            </a>
        </template>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
        <script>
            const ddb_items = {
                "items": [{
                        "link": "N57I3YRBVW73LLC7V6W5Z6PDHJAEMXCP",
                        "text": "Ein in LIDO digitalisiertes Buch mit 469 Seiten (!). Gut geeingnet für die Anzeige in den IIIF-Viewern."
                    }, {
                        "status": "warning",
                        "link": "SDD2UHI6DHFQT6MOWQBQEWJRECTUCWGW",
                        "text": "Beethovens 5. in vier Audiodateien. Leider spielt der Universal Viewer die Audio-Daten nicht ab, weil das Manifest die „duration“ nicht enthält. Diese Information wird aktuell nicht in der DDB gespeichert."
                    }, {
                        "link": "XL5HT36MHHYBPY7SGUT7YUJBJMPVSUII",
                        "text": "Ein Museumsobjekt mit umfangreichen Metadaten."
                    }, {
                        "link": "TLCKVDW6HU7KHWM6I4VIE3VZ7R2XPXIY",
                        "text": "Ein Museumsobjekt einer langen Bildunterschrift unter einem hochaufgelösten Digtalisat."
                    }, {
                        "link": "CZNOZMUMWB6HNRDKI445X3Q6WNC63TFL",
                        "text": "Ein Museumsobjekt mit 15 Digitalisaten und umfangreichen Metadaten."
                    }, {
                        "link": "GO7LV4P263UK7GRATYYRBRDFQLG4QCJW",
                        "text": "Ein Museumsobjekt mit einem hochaufgelösten Digitalisat."
                    }, {
                        "link": "Y2OWR7OUIZG5NSYQGIX4LUZ4ZB7SRTFP",
                        "text": "Ein Video"
                    }, {
                        "link": "EUO5IXF72NFMHD7UGD3X7AWQXNTQSPTK",
                        "text": "Ein Audio-Datei"
                    }, {
                        "link": "LN7D6DTSLX7XU4TULJHAHREPJA3MDYTC",
                        "text": "3D-Objekte"
                    }, {
                        "link": "GJS5MQFEZENWD7S2IX4LUKYPWQKMJ5BH",
                        "text": "Bilder mit einer Audio-Datei."
                    }, {
                        "link": "2NGUCS22WFYDLCOUUWZWJ6BDJQT5MNH7",
                        "text": "Ein hochaufgelöstes Bild"
                    }, {
                        "link": "UT7QCBPP626TE3HTJDMJN7HVJ22IUEEO",
                        "text": "Sechs hochaufgelöste Fotos einer Flöte"
                    }, {
                        "status": "warning",
                        "link": "3ZGWWJ2MRM2FBLUTDZL632QSBIRWV6RY",
                        "text": "Eine Audiodateien mit Schallplattencover. Das Cover wird in der DDB nicht extra angezeigt und als Platzhalterbild für die Audio-Dateien benutzt. IIIF sieht vor, dass die Dauer der Audiodateien im Manifest angegeben werden. Diese Information liegt in der DDB nicht vor, entsprechend kann z.B. der universalviewer die Daten nicht korrekt wiedergeben."
                    }, {
                        "status": "warning",
                        "link": "RJFKTPD3N5NGHOURMGXIDKVMM4DD3F6X",
                        "text": "Ein Video. Das Video hat zusätzlich ein Still, das in den IIIF-Manifesten und im Gegensatz zum DDB-Portal angezeigt wird. Der Universal Viewer benötigt zwingen die Spieldauer eines Videos. Diese Information kann von der DDB nicht zur Verfügung gestellt werden, entsprechend funktioniert die Anzeige von Video/ Audio im Universal-Viewer nicht korrekt."
                    }, {
                        "status": "warning",
                        "link": "7PE22PNGEYG6G5HEGVOVYT7YXJVCTMM7",
                        "text": "Eine PDF-Datei mit Vorschaubild. PDFs werden aktuell nur vom Universal Viewer unterstützt. Der Mirador 3 Viewer zeigt z.B. nur eine weiße Seite an."
                    }, {
                        "link": "IRMHSA4Q6RXQVYADHYNIQNVE53T6JREJ",
                        "text": "Eine 106-seitige Archivalie. Das Laden dauert länger, weil für jedes Digitalisat die maximale Auflösung über den IIIF Image-Dienst herausgefunden werden muss."
                    }, {
                        "status": "danger",
                        "link": "XMGSUZVVNRFTRUT2PL4M2RPPICEXZ6CQ",
                        "text": "Vimeo-Videos können in IIIF nicht repräsentiert werden. Entsprechend zeigt keiner der Viewer diese an."
                    }, {
                        "link": "TTNVQWVXY3AKILUHHULXB5H2ZHZGEKOO",
                        "text": "Ein hochaufgelöstes Digitalisat"
                    }, {
                        "status": "warning",
                        "link": "QCWBCVL6F64T6PHGAUCIFC57CWUC7YXV",
                        "text": "Eine Bild-, eine Video- und sechs Audio-Dateien."
                    }]
            };

            const metsmods_items = {
                "items": [{
                        "link": "PYYWTJ6DQSRHHQMLIIOJ3SANDJBS5QQ7",
                        "text": "Tafel in einer Mongrafie"
                    }, {
                        "link": "D7CTTZ55NCSYJMZFBOAEE5PSS2PVODZT",
                        "text": "Monografie"
                    }, {
                        "link": "C4OICKVZCLE3E2HVAQGEVKK6MOGJOLKV",
                        "text": "Abschnitt"
                    }, {
                        "link": "M3FDWSLR53SH7A25HS34Z5AVEYMYLSZV",
                        "text": "Heft"
                    }, {
                        "link": "FNY2WQQOGN4ZV6DJIADNKWFWXH2F73HT",
                        "text": "Band"
                    }, {
                        "link": "KPPFXEP6DRPCK6DAOL22RPURI5MHF7RC",
                        "text": "IIIF-Bilder, keine ALTO-Volltexte (Sehr groß! Es wird 565x die jeweilige info.json abgerufen.)",
                        "status": "warning"
                    }, {
                        "link": "WYSPZ4UGJYOETW5F7EFHLR3GRQODFKCD",
                        "text": "IIIF-Bilder und ALTO-Volltexte (Zeitung)"
                    }, {
                        "link": "YU6MWMKZEAE2YSZ3P6VNINDU7GWJ36AX",
                        "text": "Bilder auf File-Server, ALTO-Volltexte (Zeitung)"
                    },{
                        "link": "RFEMGPHZ4VFY5B6HFNZ2P3THT2FQEIKI",
                        "text": "Bilder auf File-Server, ALTO-Volltexte (keine Zeitung)"
                    },{
                        "link": "AYB5OJWK7SFXCYQNUJ5TBHKTHA56UD2Q",
                        "text": "Bilder auf File-Server, keine ALTO-Volltexte (Extrem groß! Die METS/MODS-Datei hat >66.000 Zeilen.)",
                        "status": "warning"
                    },{
                        "link": "5LJ22YR5UDIOVIJP5JP4CEMUN5TLG6IP",
                        "text": "IIIF-Bilder und ALTO-Volltexten (Zeitung)"
                    }
                    
                    
                ]
            };

            const input = document.getElementById("input");
            const manifestLink = document.getElementById("los");
            const displayType = document.getElementById("displayType");
            const exampleTemplate = document.getElementById("example-item");
            const itemPattern = /^https:\/\/www(?:-(q[12]))?\.deutsche-digitale-bibliothek\.de\/item\/([a-z2-7]{32})\/?(?:[?#].*)?$/i;
            let viewer = "";

            function updateManifestLink() {
                const match = itemPattern.exec(input.value.trim());
                manifestLink.classList.toggle("disabled", !match);
                manifestLink.setAttribute("aria-disabled", String(!match));
                if (!match) {
                    manifestLink.removeAttribute("href");
                    return;
                }

                const [, system, id] = match;
                const manifest = new URL(id.toUpperCase(), window.location.href);
                if (system) {
                    manifest.searchParams.set("system", system.toUpperCase());
                }
                manifestLink.href = viewer ? viewer + encodeURIComponent(manifest.href) : manifest.href;
            }

            async function loadExampleMetadata(id, item) {
                try {
                    const response = await fetch("https://api.deutsche-digitale-bibliothek.de/2/items/" + id);
                    if (!response.ok) {
                        return;
                    }
                    const data = await response.json();
                    const title = data?.view?.item?.title;
                    const type = data?.source?.description?.record?.type;
                    if (title) {
                        item.querySelector(".list-group-item-title").textContent = title;
                    }
                    if (type) {
                        item.querySelector(".list-group-item-type").textContent = type;
                    }

                    const binaries = data?.binaries?.binary;
                    const thumbnail = (Array.isArray(binaries) ? binaries : [binaries]).find(binary =>
                        binary?.ref && ["image/jpeg", "application/pdf"].includes(binary.mimetype));
                    if (thumbnail) {
                        const image = item.querySelector(".list-group-item-image");
                        image.src = "https://iiif.deutsche-digitale-bibliothek.de/image/2/"
                            + thumbnail.ref + "/full/!116,87/0/default.jpg";
                        image.hidden = false;
                    }
                } catch {
                    // Keep the example selectable when its metadata is unavailable.
                }
            }

            function renderExamples(list, examples) {
                for (let i = examples.length - 1; i > 0; i--) {
                    const other = Math.floor(Math.random() * (i + 1));
                    [examples[i], examples[other]] = [examples[other], examples[i]];
                }

                for (const example of examples) {
                    const item = exampleTemplate.content.firstElementChild.cloneNode(true);
                    item.href = "https://www.deutsche-digitale-bibliothek.de/item/" + example.link;
                    item.querySelector(".list-group-item-link").textContent = item.href;
                    item.querySelector(".list-group-item-text").textContent = example.text;
                    if (example.status) {
                        item.classList.add("list-group-item-" + example.status);
                    }
                    item.addEventListener("click", event => {
                        event.preventDefault();
                        input.value = item.href;
                        updateManifestLink();
                        window.scrollTo({top: 0, behavior: "smooth"});
                    });
                    list.appendChild(item);
                    loadExampleMetadata(example.link, item);
                }
            }

            document.querySelectorAll("#displayTypeDropdown .dropdown-item").forEach(option => {
                option.addEventListener("click", () => {
                    displayType.textContent = option.textContent;
                    viewer = option.dataset.href;
                    updateManifestLink();
                });
            });

            input.addEventListener("input", updateManifestLink);
            input.addEventListener("keydown", event => {
                if (event.key === "Enter" && manifestLink.hasAttribute("href")) {
                    event.preventDefault();
                    manifestLink.click();
                }
            });
            updateManifestLink();
            renderExamples(document.getElementById("ddb-listgroup"), ddb_items.items);
            renderExamples(document.getElementById("metsmods-listgroup"), metsmods_items.items);
        </script>
    </body>
</html>
